
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101827">
<title>MedAtlas Groups</title>

<style>
:root{
--bg:#0b1220;--panel:#111c2e;--panel2:#18263a;
--text:#f3f6fc;--muted:#91a1b8;--accent:#6485ff;
--border:rgba(255,255,255,.08);--mine:#304d9b;--other:#1b2a40
}
*{box-sizing:border-box}
body{
margin:0;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial;
background:var(--bg);color:var(--text);height:100dvh;overflow:hidden
}
button,input,textarea{font:inherit}
button{cursor:pointer}
.app{
height:100dvh;max-width:850px;margin:auto;display:flex;
flex-direction:column;background:var(--bg);position:relative
}
header{
height:68px;flex-shrink:0;display:flex;align-items:center;
gap:12px;padding:0 16px;background:var(--panel);
border-bottom:1px solid var(--border);z-index:2
}
.logo{
width:43px;height:43px;border-radius:14px;display:grid;
place-items:center;background:linear-gradient(135deg,#688cff,#4256bd);
font-size:22px
}
.head-info{flex:1;min-width:0}
.head-info strong{display:block;font-size:15px}
.head-info small{color:var(--muted);font-size:12px}
.status-dot{
display:inline-block;width:7px;height:7px;border-radius:50%;
background:#37d99b;margin-left:5px
}
.icon-btn{
width:40px;height:40px;border:0;border-radius:13px;
color:var(--text);background:var(--panel2);font-size:19px
}
.messages{
flex:1;overflow-y:auto;padding:18px 13px 25px;
scroll-behavior:smooth;overscroll-behavior:contain
}
.messages::-webkit-scrollbar{width:4px}
.messages::-webkit-scrollbar-thumb{background:#34445d;border-radius:10px}
.message{
display:flex;gap:8px;margin:12px 0;align-items:flex-end;
animation:appear .18s ease
}
.message.mine{flex-direction:row-reverse}
@keyframes appear{
from{opacity:0;transform:translateY(7px)}
to{opacity:1;transform:translateY(0)}
}
.avatar{
width:34px;height:34px;border-radius:50%;object-fit:cover;
background:var(--panel2);flex-shrink:0
}
.bubble{
max-width:min(78%,520px);padding:10px 12px 7px;
border-radius:17px;background:var(--other);overflow-wrap:anywhere
}
.mine .bubble{background:var(--mine);border-bottom-right-radius:5px}
.message:not(.mine) .bubble{border-bottom-left-radius:5px}
.sender{
font-size:11px;font-weight:700;color:#a9bcff;margin-bottom:5px
}
.message-text{white-space:pre-wrap;line-height:1.65;font-size:14px}
.msg-image{
max-width:100%;max-height:260px;display:block;border-radius:11px;
margin-top:5px;object-fit:cover;cursor:pointer
}
.meta{
display:flex;justify-content:flex-end;gap:5px;margin-top:5px;
color:#c1cce0;font-size:10px;opacity:.8
}
.composer-wrap{
padding:10px 12px calc(10px + env(safe-area-inset-bottom));
background:var(--panel);border-top:1px solid var(--border);flex-shrink:0
}
.preview{
display:none;padding:5px 0 10px;align-items:center;gap:10px
}
.preview img{width:55px;height:55px;border-radius:10px;object-fit:cover}
.preview button{
border:0;background:#263650;color:white;width:30px;height:30px;
border-radius:50%
}
.composer{display:flex;align-items:flex-end;gap:8px}
.attach{
width:43px;height:43px;flex-shrink:0;border:0;border-radius:14px;
background:var(--panel2);color:var(--text);font-size:21px
}
#messageInput{
flex:1;min-width:0;max-height:120px;resize:none;
border:1px solid var(--border);border-radius:15px;
padding:12px 14px;outline:none;color:var(--text);
background:var(--panel2);font-size:14px
}
#messageInput:focus{border-color:var(--accent)}
.send{
width:44px;height:44px;border:0;border-radius:14px;
background:var(--accent);color:white;font-size:19px;flex-shrink:0
}
.send:disabled{opacity:.5}
.notice{text-align:center;color:var(--muted);font-size:11px;padding:7px 0 0}
.empty{text-align:center;color:var(--muted);margin-top:90px}
.empty div{font-size:42px;margin-bottom:12px}
#setup{
position:fixed;inset:0;z-index:10;display:none;
align-items:center;justify-content:center;background:#080f1c;padding:20px
}
.setup-card{
width:100%;max-width:370px;background:var(--panel);padding:25px;
border-radius:24px;border:1px solid var(--border);text-align:center
}
.setup-card h2{margin:0 0 8px}
.setup-card p{color:var(--muted);font-size:13px}
.profile-preview{
width:90px;height:90px;margin:20px auto;border-radius:50%;
object-fit:cover;background:var(--panel2);display:block
}
.field{
width:100%;padding:13px;border:1px solid var(--border);
border-radius:12px;outline:none;background:var(--panel2);
color:var(--text);margin:8px 0
}
.primary{
width:100%;padding:13px;border:0;border-radius:12px;
background:var(--accent);color:white;margin-top:10px
}
#toast{
position:fixed;bottom:105px;left:50%;transform:translateX(-50%);
background:#243650;color:white;padding:10px 16px;border-radius:20px;
font-size:12px;opacity:0;pointer-events:none;transition:.2s;
z-index:20;white-space:nowrap;max-width:90%;overflow:hidden
}
#toast.show{opacity:1}
#imageInput{display:none}
@media(min-width:600px){
body{background:#070d17}
.app{border-left:1px solid var(--border);border-right:1px solid var(--border)}
}
</style>
</head>

<body>

<div class="app">
<header>
<div class="logo">🩺</div>
<div class="head-info">
<strong>MedAtlas Groups</strong>
<small><span class="status-dot"></span><span id="connection">جاري الاتصال...</span></small>
</div>
<button class="icon-btn" onclick="openProfile()" title="الملف الشخصي">👤</button>
</header>

<main class="messages" id="messages">
<div class="empty" id="empty">
<div>💬</div>
<strong>مرحباً بك في MedAtlas Groups</strong>
<p>ابدأ المحادثة مع أعضاء المجموعة</p>
</div>
</main>

<div class="composer-wrap">
<div class="preview" id="preview">
<img id="previewImg">
<span style="flex:1;color:var(--muted);font-size:12px">الصورة جاهزة للإرسال</span>
<button onclick="removeImage()">×</button>
</div>
<div class="composer">
<button class="attach" onclick="document.getElementById('imageInput').click()">＋</button>
<input id="imageInput" type="file" accept="image/*">
<textarea id="messageInput" rows="1" placeholder="اكتب رسالتك..."></textarea>
<button class="send" id="sendBtn" onclick="sendMessage()">➤</button>
</div>
<div class="notice">MedAtlas Groups · مساحة للتواصل وتبادل المعرفة</div>
</div>
</div>

<div id="setup">
<div class="setup-card">
<h2>مرحباً بك 👋</h2>
<p>أنشئ ملفك الشخصي للانضمام إلى المجموعة</p>
<img class="profile-preview" id="profilePreview"
src="https://placehold.co/100x100/263650/ffffff?text=M">
<button class="field" onclick="document.getElementById('avatarInput').click()">اختيار صورة شخصية</button>
<input id="avatarInput" type="file" accept="image/*" hidden>
<input id="nameInput" class="field" maxlength="30" placeholder="اسمك في المجموعة">
<button class="primary" onclick="saveProfile()">دخول المجموعة</button>
</div>
</div>

<div id="toast"></div>

<script>
/* ==========================================
   MedAtlas Groups - GitHub Configuration
========================================== */

// ضع توكن GitHub الخاص بك بين علامتي التنصيص.
// تنبيه: لا ترفع هذا الملف إلى موقع عام بعد وضع التوكن.

const GITHUB_TOKEN = "PASTE_YOUR_GITHUB_TOKEN_HERE";

const GITHUB_OWNER = "e-hr1";
const GITHUB_REPO = "MedAtlas_Groups";
const GITHUB_BRANCH = "main";

const POLL_INTERVAL = 5000;

const MESSAGES_FILE = "messages.json";
const USERS_FILE = "users.json";

const CACHE_KEY = "medatlas_group_messages_v1";
const PROFILE_KEY = "medatlas_group_profile_v1";

let profile = JSON.parse(localStorage.getItem(PROFILE_KEY) || "null");
let selectedImage = null;
let polling = false;
let sending = false;
let messagesMap = new Map();

const $ = id => document.getElementById(id);

function toast(message){
const el = $("toast");
el.textContent = message;
el.classList.add("show");
clearTimeout(toast.timer);
toast.timer = setTimeout(()=>el.classList.remove("show"),2500);
}

function setConnection(text){
$("connection").textContent = text;
}

function makeId(){
return crypto.randomUUID
? crypto.randomUUID()
: Date.now()+"_"+Math.random().toString(36).slice(2);
}

function timeText(value){
const d = value ? new Date(value) : new Date();
if(isNaN(d.getTime())) return "";
return d.toLocaleTimeString("ar",{hour:"2-digit",minute:"2-digit"});
}

function apiHeaders(){
return {
"Authorization":"Bearer "+GITHUB_TOKEN,
"Accept":"application/vnd.github+json",
"X-GitHub-Api-Version":"2022-11-28"
};
}

function apiUrl(path){
return "https://api.github.com/repos/"
+GITHUB_OWNER+"/"+GITHUB_REPO+"/contents/"
+path;
}

function checkConfig(){
return GITHUB_TOKEN &&
GITHUB_TOKEN !== "PASTE_YOUR_GITHUB_TOKEN_HERE";
}

/* تحويل Base64 إلى نص UTF-8 */

function decodeBase64(base64){
const clean = base64.replace(/\s/g,"");
const binary = atob(clean);
const bytes = Uint8Array.from(binary,c=>c.charCodeAt(0));
return new TextDecoder("utf-8").decode(bytes);
}

function encodeBase64(text){
const bytes = new TextEncoder().encode(text);
let binary = "";
const chunk = 0x8000;

for(let i=0;i<bytes.length;i+=chunk){
binary += String.fromCharCode(...bytes.subarray(i,i+chunk));
}

return btoa(binary);
}

/* قراءة ملف JSON من GitHub */

async function readGitHubFile(path){
const response = await fetch(
apiUrl(path)+"?ref="+encodeURIComponent(GITHUB_BRANCH),
{headers:apiHeaders(),cache:"no-store"}
);

if(response.status === 404){
return {data:null,sha:null};
}

const result = await response.json();

if(!response.ok){
throw new Error(result.message || "GitHub read error");
}

if(!result.content){
throw new Error("ملف GitHub فارغ أو غير قابل للقراءة");
}

const content = decodeBase64(result.content);

return {
data:JSON.parse(content),
sha:result.sha
};
}

/* كتابة ملف JSON مع إعادة المحاولة عند التعارض */

async function updateGitHubJson(path,updateFunction){
for(let attempt=0;attempt<4;attempt++){

const current = await readGitHubFile(path);

const data = current.data || (
path === MESSAGES_FILE
? {messages:[]}
: {users:[]}
);

const updated = updateFunction(data);

const body = {
message:"Update "+path,
content:encodeBase64(JSON.stringify(updated,null,2)),
branch:GITHUB_BRANCH
};

if(current.sha){
body.sha = current.sha;
}

const response = await fetch(apiUrl(path),{
method:"PUT",
headers:{
...apiHeaders(),
"Content-Type":"application/json"
},
body:JSON.stringify(body)
});

if(response.ok){
return updated;
}

const error = await response.json().catch(()=>({}));

if(response.status === 409 ||
response.status === 422){
await new Promise(resolve=>setTimeout(resolve,500));
continue;
}

throw new Error(error.message || "GitHub write error");
}

throw new Error("حدث تعارض أثناء الحفظ. حاول مرة أخرى");
}

/* ضغط الصور */

function compressImage(file,maxSize,quality){
return new Promise((resolve,reject)=>{
const reader = new FileReader();

reader.onload = ()=>{
const img = new Image();

img.onload = ()=>{
const scale = Math.min(
1,maxSize/Math.max(img.width,img.height)
);

const canvas = document.createElement("canvas");
canvas.width = Math.round(img.width*scale);
canvas.height = Math.round(img.height*scale);

canvas.getContext("2d").drawImage(
img,0,0,canvas.width,canvas.height
);

resolve(canvas.toDataURL("image/jpeg",quality));
};

img.onerror = reject;
img.src = reader.result;
};

reader.onerror = reject;
reader.readAsDataURL(file);
});
}

/* رفع صورة إلى مجلد uploads/images */

async function uploadImage(dataUrl){
const base64 = dataUrl.split(",")[1];

if(!base64) throw new Error("الصورة غير صالحة");

const fileName = "uploads/images/"+makeId()+".jpg";

const response = await fetch(apiUrl(fileName),{
method:"PUT",
headers:{
...apiHeaders(),
"Content-Type":"application/json"
},
body:JSON.stringify({
message:"Upload chat image",
content:base64,
branch:GITHUB_BRANCH
})
});

const result = await response.json();

if(!response.ok){
throw new Error(result.message || "Image upload failed");
}

return "https://raw.githubusercontent.com/"
+GITHUB_OWNER+"/"+GITHUB_REPO+"/"
+GITHUB_BRANCH+"/"+fileName;
}

/* الملف الشخصي */

function openProfile(){
$("nameInput").value = profile?.name || "";
$("profilePreview").src =
profile?.avatar ||
"https://placehold.co/100x100/263650/ffffff?text=M";

$("setup").style.display = "flex";
}

$("avatarInput").addEventListener("change",async e=>{
const file = e.target.files[0];
if(!file) return;

if(!file.type.startsWith("image/")){
return toast("اختر صورة صحيحة");
}

try{
const data = await compressImage(file,300,0.7);
selectedImage = data;
$("profilePreview").src = data;
}catch{
toast("تعذر قراءة الصورة");
}
});

async function saveProfile(){
const name = $("nameInput").value.trim();

if(!name) return toast("اكتب اسمك أولاً");

if(!checkConfig()) return toast("أضف توكن GitHub أولاً");

profile = {
uid:profile?.uid || makeId(),
name,
avatar:selectedImage || profile?.avatar || ""
};

localStorage.setItem(PROFILE_KEY,JSON.stringify(profile));

$("setup").style.display = "none";
selectedImage = null;

toast("تم حفظ ملفك الشخصي");

try{
await registerProfile();
}catch(e){
console.error(e);
toast("تم الحفظ محلياً وتعذر رفع الملف الشخصي");
}
}

async function registerProfile(){
await updateGitHubJson(USERS_FILE,data=>{
if(!Array.isArray(data.users)) data.users = [];

const index = data.users.findIndex(
u=>u.uid === profile.uid
);

const user = {
uid:profile.uid,
name:profile.name,
avatar:profile.avatar
};

if(index >= 0){
data.users[index] = user;
}else{
data.users.push(user);
}

return data;
});
}

/* اختيار الصور */

$("imageInput").addEventListener("change",async e=>{
const file = e.target.files[0];
e.target.value = "";

if(!file) return;

if(!file.type.startsWith("image/")){
return toast("الملف ليس صورة");
}

if(file.size > 10*1024*1024){
return toast("حجم الصورة أكبر من 10MB");
}

try{
selectedImage = await compressImage(file,1280,0.78);
$("previewImg").src = selectedImage;
$("preview").style.display = "flex";
}catch{
toast("تعذر تجهيز الصورة");
}
});

function removeImage(){
selectedImage = null;
$("preview").style.display = "none";
}

/* عرض الرسائل */

function addMessage(msg){
if(!msg || !msg.id || messagesMap.has(msg.id)) return;

messagesMap.set(msg.id,msg);
renderMessage(msg);

$("empty").style.display = "none";
}

function renderMessage(msg){
const isMine = msg.uid === profile?.uid;

const row = document.createElement("div");
row.className = "message"+(isMine?" mine":"");
row.dataset.id = msg.id;

const avatar = document.createElement("img");
avatar.className = "avatar";
avatar.src = msg.avatar ||
"https://placehold.co/100x100/263650/ffffff?text=M";

avatar.onerror = ()=>{
avatar.src = "https://placehold.co/100x100/263650/ffffff?text=M";
};

const bubble = document.createElement("div");
bubble.className = "bubble";

const sender = document.createElement("div");
sender.className = "sender";
sender.textContent = isMine ? "أنت" : (msg.name || "عضو");
bubble.appendChild(sender);

if(msg.text){
const text = document.createElement("div");
text.className = "message-text";
text.textContent = msg.text;
bubble.appendChild(text);
}

if(msg.imageUrl){
const img = document.createElement("img");
img.className = "msg-image";
img.src = msg.imageUrl;
img.loading = "lazy";
img.onclick = ()=>window.open(msg.imageUrl,"_blank");
bubble.appendChild(img);
}

const meta = document.createElement("div");
meta.className = "meta";
meta.textContent = timeText(msg.createdAt);
bubble.appendChild(meta);

row.append(avatar,bubble);
$("messages").appendChild(row);
}

function saveCache(){
try{
const list = [...messagesMap.values()].slice(-100);
localStorage.setItem(CACHE_KEY,JSON.stringify(list));
}catch(e){
console.warn(e);
}
}

function loadCache(){
try{
const list = JSON.parse(
localStorage.getItem(CACHE_KEY) || "[]"
);

list.forEach(addMessage);
}catch(e){
console.warn("Cache error",e);
}
}

/* جلب الرسائل */

async function loadMessages(){
if(polling || !checkConfig()) return;

polling = true;

try{
const result = await readGitHubFile(MESSAGES_FILE);

const list = Array.isArray(result.data?.messages)
? result.data.messages
: [];

list.sort((a,b)=>
new Date(a.createdAt)-new Date(b.createdAt)
);

list.forEach(addMessage);

saveCache();
setConnection("متصل");

}catch(e){
console.error(e);
setConnection("تعذر الاتصال");
}finally{
polling = false;
}
}

/* إرسال رسالة */

async function sendMessage(){
if(sending) return;

const text = $("messageInput").value.trim();

if(!text && !selectedImage) return;

if(!profile){
openProfile();
return;
}

if(!checkConfig()){
toast("أضف توكن GitHub في الكود");
return;
}

sending = true;
$("sendBtn").disabled = true;

const localId = makeId();
const imageData = selectedImage;

const message = {
id:localId,
uid:profile.uid,
name:profile.name,
avatar:profile.avatar,
text,
imageUrl:"",
createdAt:new Date().toISOString(),
pending:true
};

/* عرض الرسالة فوراً */

addMessage(message);
saveCache();
scrollBottom();

$("messageInput").value = "";
$("messageInput").style.height = "auto";
removeImage();

try{
let imageUrl = "";

if(imageData){
toast("جارٍ رفع الصورة...");
imageUrl = await uploadImage(imageData);
}

await updateGitHubJson(MESSAGES_FILE,data=>{
if(!Array.isArray(data.messages)){
data.messages = [];
}

if(!data.messages.some(m=>m.id === localId)){
data.messages.push({
...message,
imageUrl,
pending:false
});
}

return data;
});

const old = document.querySelector(
'[data-id="'+CSS.escape(localId)+'"]'
);

if(old) old.remove();

messagesMap.delete(localId);

addMessage({
...message,
imageUrl,
pending:false
});

saveCache();
scrollBottom();
toast("تم إرسال الرسالة");

}catch(e){
console.error(e);
toast("فشل الإرسال: "+e.message);
}finally{
sending = false;
$("sendBtn").disabled = false;
}
}

function scrollBottom(){
const box = $("messages");

requestAnimationFrame(()=>{
box.scrollTop = box.scrollHeight;
});
}

/* الكتابة والإرسال */

$("messageInput").addEventListener("input",function(){
this.style.height = "auto";
this.style.height = Math.min(this.scrollHeight,120)+"px";
});

$("messageInput").addEventListener("keydown",e=>{
if(e.key === "Enter" && !e.shiftKey){
e.preventDefault();
sendMessage();
}
});

/* تشغيل التطبيق */

async function start(){
loadCache();

if(!checkConfig()){
setConnection("التوكن غير مضاف");
openProfile();
return;
}

if(!profile){
openProfile();
}else{
$("setup").style.display = "none";
}

try{
await loadMessages();
setInterval(loadMessages,POLL_INTERVAL);
}catch(e){
console.error(e);
setConnection("تعذر الاتصال");
}
}

start();
</script>
</body>
</html>
