
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MedAtlas Groups</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Tahoma,Arial,sans-serif;
 background:#f3f5fa;
 color:#172033;
}
button,input{font:inherit}
button{cursor:pointer;border:0}
.header{
 background:#172b46;color:white;
 padding:15px 18px;
 display:flex;align-items:center;gap:12px;
}
.logo{
 width:43px;height:43px;
 background:#ffffff20;
 border-radius:13px;
 display:grid;place-items:center;
 font-size:23px;
}
.header-info{flex:1}
.header-info strong{display:block;font-size:17px}
.header-info small{color:#b9c9dc}
.status{font-size:11px;color:#8ee6ac}
.container{
 max-width:850px;
 margin:auto;
 height:100dvh;
 display:flex;
 flex-direction:column;
 background:white;
 box-shadow:0 0 25px #00000008;
}
#messages{
 flex:1;overflow-y:auto;
 padding:17px;
 background:#f5f7fb;
}
.message{
 display:flex;gap:9px;
 margin-bottom:17px;
 align-items:flex-start;
}
.message.mine{flex-direction:row-reverse}
.avatar{
 width:39px;height:39px;
 border-radius:50%;object-fit:cover;
 background:#ddd;flex-shrink:0;
}
.bubble{
 max-width:78%;
 background:white;
 border:1px solid #e8ebf1;
 padding:10px 13px;
 border-radius:13px 13px 13px 3px;
 box-shadow:0 2px 5px #00000005;
 overflow-wrap:anywhere;
}
.mine .bubble{
 background:#e4efff;
 border-color:#d9e7ff;
 border-radius:13px 13px 3px 13px;
}
.sender{font-size:12px;color:#5578bb;font-weight:bold;margin-bottom:5px}
.content{font-size:14px;line-height:1.7;white-space:pre-wrap}
.time{font-size:10px;color:#9aa4b3;margin-top:6px}
.message-image{
 max-width:230px;width:100%;
 display:block;border-radius:9px;margin-top:5px;
}
.composer{
 padding:12px;
 border-top:1px solid #edf0f5;
 display:flex;gap:9px;align-items:center;
}
.composer input{
 flex:1;min-width:0;
 border:1px solid #e1e5ed;
 border-radius:25px;padding:12px;
 outline:none;
}
.icon-btn{
 width:43px;height:43px;
 border-radius:50%;
 background:#eef3fa;color:#345b91;
 font-size:19px;
}
.send{
 background:#416ee8;color:white;
}
.screen{
 position:fixed;inset:0;
 background:#f3f5fa;
 display:flex;align-items:center;justify-content:center;
 padding:18px;z-index:10;
}
.panel{
 width:100%;max-width:390px;
 background:white;padding:25px;
 border-radius:20px;
 box-shadow:0 10px 35px #00000012;
}
.panel h2{margin-top:0}
.panel input{
 width:100%;padding:13px;
 border:1px solid #dfe4ed;
 border-radius:10px;margin:8px 0;
}
.primary{
 background:#416ee8;color:white;
 padding:13px;border-radius:10px;width:100%;
 margin-top:10px;
}
.preview{
 width:85px;height:85px;
 border-radius:50%;object-fit:cover;
 display:block;margin:12px auto;
 background:#eee;
}
.hidden{display:none!important}
.settings{
 position:fixed;inset:0;
 background:#0008;z-index:20;
 display:flex;align-items:center;justify-content:center;
 padding:15px;
}
.settings .panel{max-height:90vh;overflow:auto}
.notice{
 font-size:12px;color:#788497;line-height:1.8;
 margin-top:12px;
}
#loading{text-align:center;padding:20px;color:#718096}
@media(max-width:500px){
 .container{height:100dvh}
 .bubble{max-width:84%}
}
</style>
</head>

<body>

<div class="container">

 <header class="header">
  <div class="logo">💬</div>
  <div class="header-info">
   <strong>MedAtlas Groups</strong>
   <small>مجموعة المحادثة العامة</small>
  </div>
  <div class="status">● مباشر</div>
  <button class="icon-btn" onclick="openSettings()">⚙</button>
 </header>

 <main id="messages">
  <div id="loading">جاري تحميل المحادثة...</div>
 </main>

 <div class="composer">
  <button class="icon-btn" onclick="document.getElementById('imageInput').click()">📎</button>
  <input id="messageInput" placeholder="اكتب رسالتك..." maxlength="2000">
  <button class="icon-btn send" onclick="sendMessage()">➤</button>
  <input type="file" id="imageInput" accept="image/*" hidden onchange="sendImage(event)">
 </div>

</div>

<!-- إعداد المستخدم -->
<div class="screen hidden" id="profileScreen">
 <div class="panel">
  <h2>مرحباً بك 👋</h2>
  <p>اختر اسمك وصورتك للانضمام إلى المجموعة.</p>
  <img class="preview" id="avatarPreview">
  <input type="file" id="avatarInput" accept="image/*" onchange="previewAvatar(event)">
  <input id="userName" placeholder="اسم المستخدم" maxlength="35">
  <button class="primary" onclick="saveProfile()">دخول المجموعة</button>
 </div>
</div>

<!-- الإعدادات -->
<div class="settings hidden" id="settingsScreen">
 <div class="panel">
  <h2>إعدادات الاتصال</h2>
  <input id="tokenInput" type="password" placeholder="GitHub Token">
  <button class="primary" onclick="saveToken()">حفظ التوكن</button>
  <button class="primary" style="background:#64748b" onclick="changeProfile()">تغيير بياناتي</button>
  <button class="primary" style="background:#ddd;color:#222" onclick="closeSettings()">إغلاق</button>
  <p class="notice">
   هذا نموذج تجريبي. التوكن المخزن في المتصفح ليس آمناً
   ولا ينبغي استخدامه على موقع عام.
  </p>
 </div>
</div>

<script>
/* إعداد المستودع */
const OWNER = "e-hr1";
const REPO = "MedAtlas_Groups";
const BRANCH = "main";

const API = `https://api.github.com/repos/${OWNER}/${REPO}/contents/`;

let token = localStorage.getItem("ma_token") || "";
let user = JSON.parse(localStorage.getItem("ma_user") || "null");
let selectedAvatar = null;
let sending = false;
let lastMessageIds = new Set();

const messagesBox = document.getElementById("messages");

/* GitHub API */
async function githubRequest(path, options={}) {
 if(!token) throw new Error("أدخل GitHub Token أولاً");

 const response = await fetch(API + path,{
  ...options,
  headers:{
   "Accept":"application/vnd.github+json",
   "Authorization":"Bearer "+token,
   "X-GitHub-Api-Version":"2022-11-28",
   ...(options.headers || {})
  }
 });

 if(!response.ok){
  const error = await response.json().catch(()=>({}));
  throw new Error(error.message || "GitHub API Error: "+response.status);
 }
 return response.json();
}

/* قراءة الملفات */
async function readJSON(path){
 const result = await githubRequest(path+"?ref="+BRANCH);
 const decoded = decodeURIComponent(
  escape(atob(result.content.replace(/\n/g,"")))
 );
 return {
  data:JSON.parse(decoded),
  sha:result.sha
 };
}

/* كتابة الملفات */
async function writeJSON(path,data,sha){
 const content = btoa(unescape(encodeURIComponent(
  JSON.stringify(data,null,2)
 )));
 return githubRequest(path,{
  method:"PUT",
  body:JSON.stringify({
   message:"Update "+path,
   content,
   branch:BRANCH,
   ...(sha?{sha}: {})
  })
 });
}

/* رفع الصور */
async function uploadImage(file){
 if(file.size > 3*1024*1024){
  throw new Error("حجم الصورة يجب ألا يتجاوز 3MB");
 }

 const buffer = await file.arrayBuffer();
 const bytes = new Uint8Array(buffer);
 let binary = "";
 for(let i=0;i<bytes.length;i+=0x8000){
  binary += String.fromCharCode(...bytes.subarray(i,i+0x8000));
 }

 const base64 = btoa(binary);
 const ext = (file.name.split(".").pop() || "jpg")
  .toLowerCase().replace(/[^a-z0-9]/g,"");

 const path = `uploads/images/${crypto.randomUUID()}.${ext}`;

 await githubRequest(path,{
  method:"PUT",
  body:JSON.stringify({
   message:"Upload image",
   content:base64,
   branch:BRANCH
  })
 });

 return `https://raw.githubusercontent.com/${OWNER}/${REPO}/${BRANCH}/${path}`;
}

/* الملف الشخصي */
function previewAvatar(event){
 const file = event.target.files[0];
 if(!file)return;
 if(file.size > 3*1024*1024){
  alert("الصورة كبيرة جداً");
  return;
 }
 selectedAvatar = file;
 document.getElementById("avatarPreview").src =
  URL.createObjectURL(file);
}

async function saveProfile(){
 const name = document.getElementById("userName").value.trim();
 if(!name)return alert("اكتب اسمك");

 if(!token)return alert("أدخل التوكن أولاً من الإعدادات");

 try{
  let avatar = user?.avatar || "";

  if(selectedAvatar){
   avatar = await uploadImage(selectedAvatar);
  }

  if(!avatar){
   avatar = "https://ui-avatars.com/api/?name="+encodeURIComponent(name);
  }

  user = {
   id:user?.id || crypto.randomUUID(),
   name,
   avatar
  };

  localStorage.setItem("ma_user",JSON.stringify(user));

  // تحديث قائمة المستخدمين
  const result = await readJSON("users.json");
  const users = result.data.users || [];
  const index = users.findIndex(u=>u.id===user.id);

  const profile = {...user,updatedAt:new Date().toISOString()};

  if(index>=0)users[index]=profile;
  else users.push(profile);

  await writeJSON("users.json",{users},result.sha);

  document.getElementById("profileScreen").classList.add("hidden");
  loadMessages();

 }catch(e){
  alert("تعذر حفظ الملف الشخصي: "+e.message);
 }
}

/* عرض الرسائل */
async function loadMessages(){
 try{
  const result = await readJSON("messages.json");
  const messages = result.data.messages || [];

  const sorted = messages.slice(-300);

  messagesBox.innerHTML="";

  if(!sorted.length){
   messagesBox.innerHTML="<div id='loading'>لا توجد رسائل بعد. ابدأ المحادثة 👋</div>";
  }

  sorted.forEach(m=>{
   const mine = user && m.userId===user.id;

   const row=document.createElement("div");
   row.className="message"+(mine?" mine":"");

   const avatar=document.createElement("img");
   avatar.className="avatar";
   avatar.src=m.avatar || "";

   const bubble=document.createElement("div");
   bubble.className="bubble";

   const sender=document.createElement("div");
   sender.className="sender";
   sender.textContent=m.name || "مستخدم";

   bubble.appendChild(sender);

   if(m.text){
    const content=document.createElement("div");
    content.className="content";
    content.textContent=m.text;
    bubble.appendChild(content);
   }

   if(m.image){
    const img=document.createElement("img");
    img.className="message-image";
    img.src=m.image;
    img.loading="lazy";
    img.onclick=()=>window.open(m.image,"_blank");
    bubble.appendChild(img);
   }

   const time=document.createElement("div");
   time.className="time";
   time.textContent=new Date(m.time).toLocaleString("ar");
   bubble.appendChild(time);

   row.appendChild(avatar);
   row.appendChild(bubble);
   messagesBox.appendChild(row);
  });

  messagesBox.scrollTop=messagesBox.scrollHeight;

 }catch(e){
  messagesBox.innerHTML=
   "<div id='loading'>تعذر تحميل الرسائل: "+
   escapeHTML(e.message)+"</div>";
 }
}

function escapeHTML(s){
 return String(s).replace(/[&<>"']/g,c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",
  '"':"&quot;","'":"&#39;"
 }[c]));
}

/* إرسال رسالة */
async function sendMessage(){
 const input=document.getElementById("messageInput");
 const text=input.value.trim();

 if(!text || sending)return;
 if(!user)return alert("أدخل بيانات المستخدم أولاً");

 sending=true;

 try{
  await appendMessage({
   id:crypto.randomUUID(),
   userId:user.id,
   name:user.name,
   avatar:user.avatar,
   text,
   image:"",
   time:new Date().toISOString()
  });

  input.value="";
  await loadMessages();

 }catch(e){
  alert("فشل الإرسال: "+e.message);
 }finally{
  sending=false;
 }
}

/* إرسال صورة */
async function sendImage(event){
 const file=event.target.files[0];
 event.target.value="";
 if(!file || !user)return;

 try{
  const image=await uploadImage(file);

  await appendMessage({
   id:crypto.randomUUID(),
   userId:user.id,
   name:user.name,
   avatar:user.avatar,
   text:"",
   image,
   time:new Date().toISOString()
  });

  await loadMessages();

 }catch(e){
  alert("فشل رفع الصورة: "+e.message);
 }
}

/* إضافة رسالة */
async function appendMessage(message){
 const result=await readJSON("messages.json");
 const messages=result.data.messages || [];

 messages.push(message);

 await writeJSON("messages.json",{
  messages:messages.slice(-500)
 },result.sha);
}

/* الإعدادات */
function openSettings(){
 document.getElementById("settingsScreen").classList.remove("hidden");
 document.getElementById("tokenInput").value=token;
}

function closeSettings(){
 document.getElementById("settingsScreen").classList.add("hidden");
}

function saveToken(){
 token=document.getElementById("tokenInput").value.trim();
 if(!token)return alert("أدخل التوكن");

 localStorage.setItem("ma_token",token);
 closeSettings();
 initialize();
}

function changeProfile(){
 closeSettings();
 document.getElementById("profileScreen").classList.remove("hidden");
 document.getElementById("userName").value=user?.name || "";
}

/* بدء التطبيق */
async function initialize(){
 if(!token){
  openSettings();
  return;
 }

 try{
  await readJSON("messages.json");

  if(!user){
   document.getElementById("profileScreen").classList.remove("hidden");
  }else{
   loadMessages();
  }
 }catch(e){
  alert("تعذر الاتصال بمستودع GitHub: "+e.message);
 }
}

/* التحديث التلقائي */
setInterval(()=>{
 if(token && user && !sending){
  loadMessages();
 }
},5000);

document.getElementById("messageInput")
.addEventListener("keydown",e=>{
 if(e.key==="Enter")sendMessage();
});

initialize();
</script>

</body>
</html>
